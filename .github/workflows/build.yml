name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:2024.1.21
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agency-apk
          path: bin/*.apk
